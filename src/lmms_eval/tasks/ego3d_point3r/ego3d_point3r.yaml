include: ego3d_default_yaml
task: ego3d_point3r
# Pointer substrate: no images; the scene arrives as pointer tokens grouped as
# "<frame-1>".. by pointer_data.py's add_frame_id.
doc_to_visual: !function utils.ego3d_doc_to_visual_pointer
# Short protocol answers in a word or a phrase, so the whole generation budget is 16
# tokens. Restated in full because include-merging is a shallow dict update.
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
lmms_eval_specific_kwargs:
  default:
    protocol: "short"
    visual_mode: "pointer"
