include: ego3d_default_yaml
task: ego3d_baseline
# Images substrate: the scene arrives as 5-7 PIL images, labelled "Frame-0: ".. by
# the model wrapper's add_frame_index, matching doc["baseline_prompt"]'s manifest.
doc_to_visual: !function utils.ego3d_doc_to_visual_images
# think protocol: a numeric answer must arrive in a closed <answer></answer> span.
process_results: !function utils.ego3d_process_results_think
lmms_eval_specific_kwargs:
  default:
    protocol: "think"
    visual_mode: "images"
